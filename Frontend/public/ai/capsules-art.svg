<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" role="img" aria-label="AI generated medical workflow artwork — three glowing medicine capsules connected by flowing arcs">
  <defs>
    <linearGradient id="wb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef9f4"/>
      <stop offset="0.5" stop-color="#e6f5ef"/>
      <stop offset="1" stop-color="#e9f4ff"/>
    </linearGradient>
    <radialGradient id="wmeshT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c79a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22c79a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wmeshV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6df6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b6df6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wmeshA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6a34d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f6a34d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capsuleA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b7e60"/>
      <stop offset="0.52" stop-color="#12a97c"/>
      <stop offset="0.6" stop-color="#f6fffd"/>
      <stop offset="0.68" stop-color="#2dd4c5"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="capsuleB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.52" stop-color="#4da6ff"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#7a6bf5"/>
      <stop offset="1" stop-color="#8b6df6"/>
    </linearGradient>
    <linearGradient id="capsuleC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a34d"/>
      <stop offset="0.52" stop-color="#f9bd6e"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#ee5a6e"/>
      <stop offset="1" stop-color="#f26baa"/>
    </linearGradient>
    <linearGradient id="chipGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="wblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="wsh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1400" height="480" fill="url(#wb)"/>
  <ellipse cx="260" cy="220" rx="420" ry="260" fill="url(#wmeshT)" filter="url(#wblur)"/>
  <ellipse cx="700" cy="150" rx="400" ry="220" fill="url(#wmeshV)" filter="url(#wblur)"/>
  <ellipse cx="1140" cy="260" rx="420" ry="260" fill="url(#wmeshA)" filter="url(#wblur)"/>

  <!-- flow arcs -->
  <g fill="none" stroke-linecap="round">
    <path class="flow-anim" d="M350 240 C 430 150 520 150 600 230" stroke="#12a97c" stroke-width="6" stroke-dasharray="2 18"/>
    <path class="flow-anim" d="M800 240 C 880 150 970 150 1050 230" stroke="#8b6df6" stroke-width="6" stroke-dasharray="2 18"/>
  </g>
  <g fill="#12a97c">
    <path d="M600 218 L626 244 L596 250 Z"/>
  </g>
  <g fill="#8b6df6">
    <path d="M1050 218 L1076 244 L1046 250 Z"/>
  </g>

  <!-- capsule 1 -->
  <g transform="translate(200,260) rotate(-10)">
    <ellipse cx="0" cy="96" rx="110" ry="18" fill="#0b3b34" fill-opacity="0.12" filter="url(#wsh)"/>
    <rect x="-110" y="-56" width="220" height="112" rx="56" fill="url(#capsuleA)"/>
    <rect x="-94" y="-36" width="188" height="16" rx="8" fill="#ffffff" fill-opacity="0.7"/>
    <ellipse cx="-58" cy="-32" rx="26" ry="8" fill="#ffffff" fill-opacity="0.85"/>
    <ellipse cx="60" cy="-32" rx="22" ry="7" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- capsule 2 -->
  <g transform="translate(700,250) rotate(8)">
    <ellipse cx="0" cy="104" rx="120" ry="18" fill="#0b3b34" fill-opacity="0.12" filter="url(#wsh)"/>
    <rect x="-120" y="-60" width="240" height="120" rx="60" fill="url(#capsuleB)"/>
    <rect x="-102" y="-38" width="204" height="17" rx="8" fill="#ffffff" fill-opacity="0.7"/>
    <ellipse cx="-64" cy="-34" rx="29" ry="9" fill="#ffffff" fill-opacity="0.85"/>
    <ellipse cx="66" cy="-34" rx="24" ry="8" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- capsule 3 -->
  <g transform="translate(1205,260) rotate(-8)">
    <ellipse cx="0" cy="96" rx="110" ry="18" fill="#0b3b34" fill-opacity="0.12" filter="url(#wsh)"/>
    <rect x="-110" y="-56" width="220" height="112" rx="56" fill="url(#capsuleC)"/>
    <rect x="-94" y="-36" width="188" height="16" rx="8" fill="#ffffff" fill-opacity="0.7"/>
    <ellipse cx="-58" cy="-32" rx="26" ry="8" fill="#ffffff" fill-opacity="0.85"/>
    <ellipse cx="60" cy="-32" rx="22" ry="7" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- glass chips behind capsules -->
  <g>
    <rect x="100" y="90" width="200" height="70" rx="24" fill="url(#chipGlass)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
    <rect x="601" y="76" width="200" height="70" rx="24" fill="url(#chipGlass)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
    <rect x="1105" y="90" width="200" height="70" rx="24" fill="url(#chipGlass)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2"/>
  </g>

  <!-- scattered pills -->
  <g>
    <circle cx="74" cy="390" r="18" fill="#ffffff" stroke="#12a97c" stroke-width="4"/>
    <circle cx="918" cy="398" r="15" fill="#f6a34d" stroke="#ffffff" stroke-width="3"/>
    <circle cx="476" cy="398" r="12" fill="#f26baa"/>
    <circle cx="1200" cy="130" r="10" fill="#2dd4c5"/>
    <circle cx="336" cy="120" r="9" fill="#8b6df6"/>
    <circle cx="560" cy="380" r="7" fill="#4da6ff"/>
  </g>
  <g stroke-linecap="round" stroke-width="4">
    <path d="M1318 78 L1318 110 M1302 94 L1334 94" stroke="#12a97c"/>
    <path d="M82 148 L82 176 M68 162 L96 162" stroke="#8b6df6"/>
    <path d="M690 398 L690 424 M677 411 L703 411" stroke="#f6a34d"/>
  </g>
</svg>