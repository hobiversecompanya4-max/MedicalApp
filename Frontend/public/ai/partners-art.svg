      <stop offset="0.4" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0b7e60"/>
    </radialGradient>
    <radialGradient id="balV" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#e3dcff"/>
      <stop offset="0.4" stop-color="#a78bfa"/>
