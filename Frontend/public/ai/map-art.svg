  <g fill="#ffffff" fill-opacity="0.65">
    <rect x="270" y="90" width="70" height="46" rx="10"/>
    <rect x="500" y="380" width="80" height="50" rx="10"/>
    <rect x="560" y="440" width="60" height="44" rx="10"/>
    <rect x="240" y="470" width="70" height="46" rx="10"/>
    <rect x="120" y="270" width="64" height="42" rx="10"/>
    <rect x="540" y="120" width="52" height="38" rx="10"/>
  </g>
  <g fill="#12a97c" fill-opacity="0.5">
    <circle cx="200" cy="70" r="6"/>
    <circle cx="740" cy="470" r="6"/>
    <circle cx="60" cy="560" r="6"/>
  </g>
</svg>