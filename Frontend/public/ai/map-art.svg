<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-label="AI generated stylised map artwork — animated delivery route ending at a glowing pharmacy pin">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f5ee"/>
      <stop offset="0.6" stop-color="#e9f6f0"/>
      <stop offset="1" stop-color="#e9f1fb"/>
    </linearGradient>
    <radialGradient id="parkG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7edbb6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7edbb6" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="mwater" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ecdfc" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9ecdfc" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a97c"/>
      <stop offset="1" stop-color="#8b6df6"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4da6ff"/>
      <stop offset="0.5" stop-color="#12a97c"/>
      <stop offset="1" stop-color="#8b6df6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="620" fill="url(#mbg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-width="3" stroke-opacity="0.85">
