    <path d="M70 0 V620 M190 0 V620 M310 0 V620 M430 0 V620 M550 0 V620 M670 0 V620"/>
  </g>

  <!-- park + water -->
  <ellipse cx="160" cy="470" rx="150" ry="105" fill="url(#parkG)"/>
  <path d="M120 450 c 18 -22 44 -20 60 -4 c 14 -12 38 -10 46 6 c 16 -6 34 4 32 22 c 14 8 8 30 -8 30 l -130 0 c -18 0 -24 -28 -8 -34 c -4 -10 2 -18 8 -20 Z" fill="#4cb782" fill-opacity="0.5"/>
  <ellipse cx="660" cy="140" rx="150" ry="90" fill="url(#mwater)"/>
  <path d="M580 130 q 40 -28 80 0 q 40 28 80 0" fill="none" stroke="#4da6ff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
  <path d="M580 155 q 40 -28 80 0 q 40 28 80 0" fill="none" stroke="#4da6ff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- main roads -->
  <g fill="none" stroke-linecap="round">
    <path d="M-10 380 C 120 360 200 300 330 290 C 460 280 520 340 650 330 C 720 325 770 300 810 290" stroke="#ffffff" stroke-width="26" stroke-opacity="0.95"/>
    <path d="M-10 380 C 120 360 200 300 330 290 C 460 280 520 340 650 330 C 720 325 770 300 810 290" stroke="#d9c9f5" stroke-width="2.5" stroke-dasharray="10 10" stroke-opacity="0.8"/>
    <path d="M420 -10 C 410 120 440 220 430 330 C 420 440 450 540 445 630" stroke="#ffffff" stroke-width="26" stroke-opacity="0.95"/>
    <path d="M420 -10 C 410 120 440 220 430 330 C 420 440 450 540 445 630" stroke="#bfe6d8" stroke-width="2.5" stroke-dasharray="10 10" stroke-opacity="0.9"/>
  </g>

  <!-- route -->
  <path d="M120 150 C 200 150 220 230 300 240 C 380 250 400 200 470 210 C 540 220 560 300 620 310 C 660 316 680 300 690 290"
    fill="none" stroke="url(#routeGrad)" stroke-width="7" stroke-linecap="round"/>
  <path class="route-anim" d="M120 150 C 200 150 220 230 300 240 C 380 250 400 200 470 210 C 540 220 560 300 620 310 C 660 316 680 300 690 290"
    fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <g>
    <circle cx="120" cy="150" r="13" fill="#4da6ff" stroke="#ffffff" stroke-width="4"/>
    <rect x="52" y="106" width="136" height="30" rx="15" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="64" y="116" width="60" height="10" rx="5" fill="#4da6ff" fill-opacity="0.7"/>
  </g>
  <g>
