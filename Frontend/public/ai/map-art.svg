    <circle class="pulse-ring" style="animation-delay:1.1s" cx="0" cy="0" r="30" fill="none" stroke="#8b6df6" stroke-width="4"/>
    <ellipse cx="0" cy="52" rx="26" ry="8" fill="#0b3b34" fill-opacity="0.15"/>
    <path d="M0 44 C -22 20 -34 4 -34 -12 C -34 -32 -18 -44 0 -44 C 18 -44 34 -32 34 -12 C 34 4 22 20 0 44 Z" fill="url(#pinGrad)"/>
    <rect x="-10" y="-30" width="20" height="20" rx="5" fill="#ffffff"/>
    <path d="M-3 -24 h6 v4 h4 v6 h-4 v4 h-6 v-4 h-4 v-6 h4 Z" fill="url(#pinGrad)"/>
    <rect x="-78" y="-88" width="156" height="34" rx="17" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="-64" y="-77" width="70" height="12" rx="6" fill="#0b3b34" fill-opacity="0.75"/>
    <circle cx="62" cy="-71" r="8" fill="#12a97c"/>
    <path d="M58 -71 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

